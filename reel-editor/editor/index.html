<title>مونتاج الريل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: an edit suite — 9:16 monitor + inspector on top, full-width zoom/audio timeline underneath. Single dark look by choice. */
:root {
  --bg: #0d1113;
  --surface: #151b1e;
  --raised: #1c2427;
  --line: #2a3539;
  --fg: #e6eef0;
  --muted: #8b9ca1;
  --pink: #ff3d9a;
  --teal: #1fb0aa;
  --danger: #ff6b5e;
  --font-ui: "IBM Plex Sans Arabic", "Noto Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 15px; line-height: 1.5; }
#root { padding-inline: 16px; padding-block: 16px 40px; max-width: 1180px; margin-inline: auto; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--raised); border-radius: 8px; padding: 7px 12px; }
button:hover { border-color: #3b4a50; }
button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }
button:disabled { opacity: .45; cursor: not-allowed; }
.app { display: flex; flex-direction: column; gap: 16px; }

.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
.brand h1 { font-size: 20px; font-weight: 700; margin: 0; text-wrap: balance; }
.rec { width: 10px; height: 10px; border-radius: 50%; background: var(--pink); box-shadow: 0 0 12px var(--pink); }
.meta { color: var(--muted); font-size: 12px; }
.top-actions { display: flex; gap: 8px; }
.primary { background: var(--pink); border-color: var(--pink); color: #1a0710; font-weight: 600; min-width: 128px; }
.primary:hover { border-color: #ff7cbc; background: #ff5aa9; }
.ghost { background: transparent; }

.work { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 16px; align-items: start; }
.stage { display: flex; justify-content: center; }
.player-wrap { width: 100%; aspect-ratio: 9 / 16; max-width: 100%; border-radius: var(--r); overflow: hidden; background: #000; border: 1px solid var(--line); }
.panel { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.group { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.group h2 { margin: 0; font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .02em; display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
.group h2 .sub { font-size: 11px; color: var(--fg); opacity: .7; }

.grades { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.grade { display: flex; flex-direction: column; align-items: stretch; gap: 6px; padding: 6px; text-align: center; font-size: 13px; }
.grade .sw { height: 38px; border-radius: 6px; }
.grade.on { border-color: var(--pink); box-shadow: 0 0 0 1px var(--pink) inset; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 6px 10px; border-radius: 999px; }
.chip i { width: 10px; height: 10px; border-radius: 50%; }
.chip.on { border-color: var(--fg); background: #26333a; }

.slider { display: flex; flex-direction: column; gap: 4px; }
.slider-head { display: flex; justify-content: space-between; font-size: 13px; }
.slider-head output { color: var(--pink); font-size: 12px; }
input[type=range] { width: 100%; accent-color: var(--pink); }

.edit-bar { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.bar-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.icon { width: 40px; height: 36px; padding: 0; font-size: 14px; }
.time { font-size: 15px; color: var(--fg); background: #0a0d0e; border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; }
.spacer { flex: 1; }
.tool { font-size: 13px; }
.tool.danger { color: var(--danger); }

.timeline { position: relative; overflow-x: auto; }
.ruler { position: relative; height: 16px; font-size: 10px; color: var(--muted); margin-inline: 52px 0; }
.ruler span { position: absolute; transform: translateX(-50%); }
.ruler span:first-child { transform: none; }
.track { position: relative; display: grid; grid-template-columns: 52px 1fr; grid-template-rows: 46px 56px; row-gap: 4px; touch-action: none; user-select: none; min-width: 560px; }
.lane-label { font-family: var(--font-mono); font-size: 10px; letter-spacing: .08em; color: var(--muted); align-self: center; }
.segments { position: relative; background: #0a0d0e; border-radius: 6px; overflow: hidden; cursor: pointer; }
.seg { position: absolute; top: 0; bottom: 0; border-inline-end: 1px solid var(--bg); display: flex; align-items: center; justify-content: center; opacity: .78; overflow: hidden; }
.seg span { font-size: 10px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.6); white-space: nowrap; }
.seg.sel { opacity: 1; box-shadow: inset 0 0 0 2px var(--fg); }
.wave { width: 100%; height: 56px; background: #0a0d0e; border-radius: 6px; color: #4f6a70; cursor: pointer; grid-column: 2; }
.wave-label { grid-row: 2; }
.cut, .playhead { position: absolute; top: 0; bottom: 0; }
.cut { width: 14px; margin-left: -7px; cursor: ew-resize; display: flex; justify-content: center; }
.cut::before { content: ""; width: 2px; height: 100%; background: var(--pink); box-shadow: 0 0 8px var(--pink); }
.cut-handle { position: absolute; top: -6px; width: 12px; height: 12px; border-radius: 3px; background: var(--pink); transform: rotate(45deg); }
.playhead { width: 2px; background: #fff; margin-left: -1px; pointer-events: none; }
.hint { margin: 0; font-size: 13px; color: var(--muted); max-width: 70ch; }

.export { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.export summary { cursor: pointer; font-weight: 600; font-size: 14px; }
.export p { color: var(--muted); font-size: 13px; margin: 8px 0; }
.export textarea { width: 100%; box-sizing: border-box; background: #0a0d0e; color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 10px; font-size: 12px; resize: vertical; }

.boot { display: grid; place-items: center; min-height: 60vh; color: var(--muted); }

@media (max-width: 760px) {
  .work { grid-template-columns: minmax(0, 1fr); }
  .player-wrap { width: min(100%, 52vh * 9 / 16); }
  .grades { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: reduce) { .rec { box-shadow: none; } }
</style>
<div id="root" dir="rtl"><div class="boot">كيتحمّل المونتاج…</div></div>
<script src="editor.js"></script>
