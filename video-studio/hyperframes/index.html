<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0a0a0a;
      }
      #root {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Roboto, Inter, ui-sans-serif, system-ui, sans-serif;
      }
      #bar {
        position: absolute;
        width: 900px;
        height: 14px;
        background: #ff3d6e;
        transform-origin: left center;
        top: 600px;
      }
      #title {
        color: #f4f4f5;
        font-size: 120px;
        font-weight: 900;
        letter-spacing: -0.03em;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5"
      data-width="1920"
      data-height="1080"
    >
      <div id="bar" class="clip" data-start="0" data-duration="5" data-track-index="0"></div>
      <h1 id="title" class="clip" data-start="0" data-duration="5" data-track-index="1">ZIKO MOTION</h1>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#bar", { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "power3.out" }, 0);
      tl.fromTo("#title", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: "back.out(2)" }, 0.3);
      tl.to("#title", { letterSpacing: "0.12em", duration: 3, ease: "none" }, 1);
      tl.to(["#title", "#bar"], { opacity: 0, duration: 0.5 }, 4.5);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
