<title>SALMA GLOW Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Playfair+Display:ital,wght@1,600;1,700&display=swap">
<style>
  /* Layout: a video editor bench. Vertical 9:16 monitor on the left, a narrow settings rail on the right; stacks on phones. */
  :root {
    --bg: #f6f1f3;
    --surface: #ffffff;
    --line: #e6dbe0;
    --fg: #241c21;
    --muted: #7a6c74;
    --accent: #e0258a;
    --accent-ink: #ffffff;
    --gold: #a07a3f;
    --font-body: "Montserrat", "Helvetica Neue", Arial, sans-serif;
    --font-title: "Playfair Display", Georgia, "Times New Roman", serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121014; --surface: #1b171d; --line: #2e2631; --fg: #f3eef1; --muted: #a99aa3;
      --accent: #ff3fa4; --accent-ink: #1b0a13; --gold: #f3d9b1; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121014; --surface: #1b171d; --line: #2e2631; --fg: #f3eef1; --muted: #a99aa3;
    --accent: #ff3fa4; --accent-ink: #1b0a13; --gold: #f3d9b1; color-scheme: dark;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 20px;
  }
  .studio {
    display: grid;
    grid-template-columns: minmax(0, 420px) minmax(0, 380px);
    gap: 28px;
    justify-content: center;
    align-items: start;
  }
  .stage { min-width: 0; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 20px); }
  .stage > div { border-radius: 18px; overflow: hidden; box-shadow: 0 20px 60px rgb(0 0 0 / 0.28); background: #000; }
  .note { margin: 10px 2px 0; font-size: 12px; color: var(--muted); }
  .panel { min-width: 0; display: flex; flex-direction: column; gap: 18px; }
  header { display: flex; flex-direction: column; gap: 4px; }
  .eyebrow { margin: 0; font-size: 11px; font-weight: 700; letter-spacing: 0.24em; text-transform: uppercase; color: var(--accent); }
  h1 { margin: 0; font-family: var(--font-title); font-style: italic; font-weight: 700; font-size: 30px; line-height: 1.15; text-wrap: balance; }
  section {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  h2 { margin: 0; font-size: 11px; font-weight: 800; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; font-weight: 600; }
  .hint { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
  input[type="range"] { width: 100%; accent-color: var(--accent); }
  input[type="color"] { width: 100%; height: 38px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); padding: 3px; }
  select {
    width: 100%; font: inherit; font-size: 13px; padding: 9px 10px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--fg);
  }
  .toggles { display: flex; flex-wrap: wrap; gap: 10px 18px; }
  .toggle { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .toggle input { accent-color: var(--accent); width: 16px; height: 16px; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; }
  button {
    font: inherit; font-size: 13px; font-weight: 700; padding: 11px 16px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .status { margin: 0; font-size: 13px; color: var(--accent); }
  textarea {
    width: 100%; box-sizing: border-box; font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px; resize: vertical;
  }
  .loading { padding: 40px 0; text-align: center; color: var(--muted); font-size: 14px; }
  @media (max-width: 860px) {
    .studio { grid-template-columns: minmax(0, 1fr); }
    .stage { position: static; max-width: 420px; margin-inline: auto; width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
<div id="root"><p class="loading">Chargement du studio…</p></div>
<script src="studio.js"></script>
